name: CI

# Runs type checking and unit tests on every push and pull request.
# E2E tests are intentionally excluded here because they require a real
# ANTHROPIC_API_KEY and make live LLM calls; run them separately with
# `bun run test:e2e`.

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Unit tests
        run: bun run test:unit
