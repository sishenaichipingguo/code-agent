name: Release

# Builds standalone binaries for every platform and attaches them to a GitHub
# Release whenever you push a version tag (e.g. v0.1.0).
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# You can also trigger it manually from the Actions tab (workflow_dispatch).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Linux + Windows binaries (cross-compiled on a single Linux runner)
  # ---------------------------------------------------------------------------
  build-linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binaries
        run: |
          bun run build:binary:linux-x64
          bun run build:binary:linux-arm64
          bun run build:binary:windows-x64

      - name: Package
        run: |
          cd dist
          tar -czf agent-linux-x64.tar.gz agent-linux-x64
          tar -czf agent-linux-arm64.tar.gz agent-linux-arm64
          zip agent-windows-x64.zip agent-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-windows
          path: |
            dist/agent-linux-x64.tar.gz
            dist/agent-linux-arm64.tar.gz
            dist/agent-windows-x64.zip

  # ---------------------------------------------------------------------------
  # macOS binaries (built + ad-hoc signed on a macOS runner)
  # bun-compiled binaries carry an invalid signature and macOS will SIGKILL
  # them until they are re-signed, so we strip and re-sign here.
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binaries
        run: |
          bun run build:binary:darwin-x64
          bun run build:binary:darwin-arm64

      - name: Ad-hoc sign (required for bun-compiled macOS binaries)
        run: |
          for bin in dist/agent-darwin-x64 dist/agent-darwin-arm64; do
            codesign --remove-signature "$bin" 2>/dev/null || true
            codesign -s - --force "$bin"
            codesign -v "$bin" && echo "signed: $bin"
          done

      - name: Package
        run: |
          cd dist
          tar -czf agent-darwin-x64.tar.gz agent-darwin-x64
          tar -czf agent-darwin-arm64.tar.gz agent-darwin-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-macos
          path: |
            dist/agent-darwin-x64.tar.gz
            dist/agent-darwin-arm64.tar.gz

  # ---------------------------------------------------------------------------
  # Collect all artifacts and publish a single GitHub Release
  # ---------------------------------------------------------------------------
  release:
    needs: [build-linux-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          cd release
          shasum -a 256 * > SHA256SUMS
          ls -la

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
